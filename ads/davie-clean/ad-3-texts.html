<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--sage); }
  .headline { font-size: 100px; margin-top: 36px; }
  .headline em { font-style: normal; color: var(--green-2); -webkit-text-stroke: 0; }

  .phone {
    margin-top: 40px;
    width: 740px;
    background: #fff;
    border-radius: 54px;
    padding: 26px 30px 34px;
    box-shadow: 0 34px 80px rgba(29, 59, 50, 0.22);
    border: 10px solid #111;
  }
  .contact {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding-bottom: 20px; border-bottom: 1px solid #ececec;
  }
  .avatar {
    width: 70px; height: 70px; border-radius: 50%;
    background: linear-gradient(135deg, #f3c6b5, #e89a83);
    display: grid; place-items: center; font-size: 36px;
  }
  .contact b { font-size: 22px; font-weight: 600; color: #222; }
  .thread { display: flex; flex-direction: column; gap: 16px; padding-top: 26px; }
  .msg {
    max-width: 86%;
    padding: 17px 26px;
    border-radius: 28px;
    font-size: 30px;
    line-height: 1.3;
  }
  .them { background: #e9e9eb; color: #111; align-self: flex-start; border-bottom-left-radius: 8px; }
  .me { background: #0a84ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 8px; }
  .time { align-self: center; font-size: 17px; color: #999; font-weight: 500; }

  .cta { margin-top: auto; flex: none; }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><div class="name">Davie Clean</div><div class="sub">CLEANING CO.</div></div>

  <h1 class="headline">Come home<br>to <em>wow.</em></h1>

  <div class="phone">
    <div class="contact"><div class="avatar">😍</div><b>Babe ❤️</b></div>
    <div class="thread">
      <div class="time">Today 5:42 PM</div>
      <div class="msg them">wait… did you clean the WHOLE house?? 😳</div>
      <div class="msg me">nope 😌 Davie Clean did</div>
      <div class="msg them">the kitchen is literally sparkling ✨</div>
      <div class="msg me">already booked the next one 🙌</div>
    </div>
  </div>

  <div class="cta">Get a Free Quote <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div class="area">Trusted &amp; Insured · 5-Star Rated · Davie, FL &amp; nearby</div>
</div>
</body>
</html>
