<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hammaad Sattar</title>
  <style>
    :root { --bg: #fafafa; --fg: #111; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #f2f2f2; --muted: #999; } }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.02em; }
    p { margin-top: 12px; color: var(--muted); font-size: 1.1rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Hammaad Sattar</h1>
    <p>Site coming soon · <a href="https://github.com/Hsattar123">GitHub</a></p>
  </main>
</body>
</html>
